name: MultiCraft WebAssembly Test

on:
  workflow_dispatch:

jobs:
  wasm-test:
    name: "WebAssembly Build Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Check Emscripten
        run: |
          emcc --version

      - name: Build SQLite for WebAssembly
        run: |
          git clone -b version-3.51.1 --depth 1 https://github.com/sqlite/sqlite.git sqlite-src
          cd sqlite-src

          emconfigure ./configure \
            --enable-static \
            --disable-shared

          emmake make -j$(nproc)

          cd ..
          mkdir -p sqlite/include sqlite/lib

          cp sqlite-src/sqlite3.h sqlite/include/
          cp sqlite-src/sqlite3ext.h sqlite/include/
          cp sqlite-src/libsqlite3.a sqlite/lib/

      - name: Build libjpeg for WebAssembly
        run: |
          git clone --depth 1 https://github.com/libjpeg-turbo/libjpeg-turbo libjpeg-src
          mkdir libjpeg-src/build
          cd libjpeg-src/build

          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF

          emmake cmake --build . --parallel

          cd ../..
          mkdir -p libjpeg/include libjpeg/lib

          cp -a libjpeg-src/src/*.h libjpeg/include/
          cp -a libjpeg-src/build/*.h libjpeg/include/
          cp libjpeg-src/build/libjpeg.a libjpeg/lib/

      - name: Build BZip2 for WebAssembly
        run: |
          git clone --depth 1 https://sourceware.org/git/bzip2.git bzip2-src
          cd bzip2-src

          emmake make clean || true
          emmake make -j$(nproc)

          cd ..
          mkdir -p bzip2/include bzip2/lib

          cp bzip2-src/bzlib.h bzip2/include/
          cp bzip2-src/libbz2.a bzip2/lib/

      - name: Build Zlib for WebAssembly
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git zlib-src
          cd zlib-src

          emcmake cmake . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

          emmake cmake --build . --parallel

          cd ..
          mkdir -p zlib/include zlib/lib

          cp zlib-src/zlib.h zlib/include/
          cp zlib-src/zconf.h zlib/include/
          cp zlib-src/libz.a zlib/lib/

      - name: Build libpng for WebAssembly
        run: |
          git clone --depth 1 https://github.com/pnggroup/libpng.git libpng-src
          mkdir libpng-src/build
          cd libpng-src/build

          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DPNG_SHARED=OFF \
            -DPNG_TESTS=OFF \
            -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib/include"

          emmake cmake --build . --parallel

          cd ../..
          mkdir -p libpng/include libpng/lib

          cp -a libpng-src/*.h libpng/include/
          cp libpng-src/build/libpng18.a libpng/lib/

      - name: Build Zstd for WebAssembly
        run: |
          git clone --depth 1 https://github.com/facebook/zstd.git zstd-src
          cd zstd-src

          emmake make -C lib \
            CC=emcc \
            AR=emar \
            RANLIB=emranlib \
            -j$(nproc)

          cd ..
          mkdir -p zstd/include zstd/lib

          cp zstd-src/lib/zstd.h zstd/include/
          cp zstd-src/lib/zdict.h zstd/include/
          cp zstd-src/lib/zstd_errors.h zstd/include/
          cp zstd-src/lib/libzstd.a zstd/lib/

      - name: Build Irrlicht for WebAssembly
        run: |
          git clone --depth 1 --single-branch --verbose https://github.com/minetest/irrlicht.git irrlicht-src

          echo "Checking dependencies:"
          ls -l "$GITHUB_WORKSPACE/zlib/lib/libz.a"
          ls -l "$GITHUB_WORKSPACE/zlib/include/zlib.h"
          ls -l "$GITHUB_WORKSPACE/libjpeg/lib/libjpeg.a"
          ls -l "$GITHUB_WORKSPACE/libjpeg/include/jpeglib.h"
          ls -l "$GITHUB_WORKSPACE/libpng/lib/libpng18.a"
          ls -l "$GITHUB_WORKSPACE/libpng/include/png.h"

          echo "Emscripten GLES libraries:"
          find "$EMSDK/upstream/emscripten/cache/sysroot/lib" \
            -iname '*GLES*' -o -iname '*gl*' | head -50

          echo "Emscripten SDL2 files:"
          find "$EMSDK/upstream/emscripten/cache/sysroot" \
            \( -iname '*SDL2*' -o -iname 'SDL.h' -o -iname 'SDL2Config.cmake' -o -iname 'sdl2-config.cmake' \) \
            2>/dev/null | head -100

          echo "Searching for SDL2 CMake files:"
          find "$EMSDK/upstream/emscripten" \
            \( -iname 'SDL2Config.cmake' -o -iname 'sdl2-config.cmake' \) \
            2>/dev/null

            echo "=== Inhalt der SDL2-CMake-Datei ==="
            cat "$EMSDK/upstream/emscripten/tools/ports/sdl2/sdl2-config.cmake"
            echo "=== Ende der SDL2-CMake-Datei ==="

          mkdir irrlicht-src/build
          echo "=== Searching for SDL_version.h ==="
          find "$EMSDK/upstream/emscripten/cache/sysroot" \
            -name "SDL_version.h" \
            -print

          echo "=== Searching for SDL2 headers ==="
          find "$EMSDK/upstream/emscripten/cache/sysroot/include" \
            -maxdepth 3 \
            -type f \
            -name "SDL*.h" \
            -print | sort
          cd irrlicht-src/build

          echo "=== Irrlicht src/CMakeLists.txt around ZLIB ==="
          echo "=== Irrlicht src/CMakeLists.txt around SDL2 version check ==="
          sed -n '260,285p' ../src/CMakeLists.txt

          echo "=== TEST: Variablen ==="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "ZLIB_LIBRARY=$GITHUB_WORKSPACE/zlib/lib/libz.a"
          echo "ZLIB_INCLUDE_DIR=$GITHUB_WORKSPACE/zlib/include"
          echo "JPEG_LIBRARY=$GITHUB_WORKSPACE/libjpeg/lib/libjpeg.a"
          echo "PNG_LIBRARY=$GITHUB_WORKSPACE/libpng/lib/libpng18.a"

          echo "=== TEST: Dateien ==="
          ls -l "$GITHUB_WORKSPACE/zlib/lib/libz.a"
          ls -l "$GITHUB_WORKSPACE/zlib/include/zlib.h"

          echo "=== SDL2 version header ==="
          cat "$EMSDK/upstream/emscripten/cache/sysroot/include/SDL/SDL_version.h" | head -80

          echo "=== SDL2 include directories ==="
          ls -ld "$EMSDK/upstream/emscripten/cache/sysroot/include/SDL2" || true
          ls -ld "$EMSDK/upstream/emscripten/cache/sysroot/include/SDL" || true

          echo "=== SDL2 version macros ==="
          grep -n "SDL_VERSION" \
            "$EMSDK/upstream/emscripten/cache/sysroot/include/SDL/SDL_version.h" | head -30

          echo "=== SDL_COMPILEDVERSION ==="
          grep -n "SDL_COMPILEDVERSION" \
            "$EMSDK/upstream/emscripten/cache/sysroot/include/SDL/SDL_version.h"

          echo "=== SDL_VERSIONNUM ==="
          grep -n -A5 "SDL_VERSIONNUM" \
            "$EMSDK/upstream/emscripten/cache/sysroot/include/SDL/SDL_version.h"

          echo "=== Emscripten SDL port ==="
          grep -n "version" \
            "$EMSDK/upstream/emscripten/tools/ports/sdl2/sdl2.py" 2>/dev/null | head -30 || true

          emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DSDL2_DIR="$EMSDK/upstream/emscripten/tools/ports/sdl2" \
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/zlib;$GITHUB_WORKSPACE/libjpeg;$GITHUB_WORKSPACE/libpng" \
          -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib/lib/libz.a" \
          -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib/include" \
          -DJPEG_LIBRARY="$GITHUB_WORKSPACE/libjpeg/lib/libjpeg.a" \
          -DJPEG_INCLUDE_DIR="$GITHUB_WORKSPACE/libjpeg/include" \
          -DPNG_LIBRARY="$GITHUB_WORKSPACE/libpng/lib/libpng18.a" \
          -DPNG_PNG_INCLUDE_DIR="$GITHUB_WORKSPACE/libpng/include" \
          -DOPENGLES2_LIBRARY="$EMSDK/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/libGL.a" \
          -DCMAKE_MESSAGE_LOG_LEVEL=DEBUG
          emmake cmake --build . --parallel

          cd ../..
          mkdir -p irrlicht/include irrlicht/lib
          cp -a irrlicht-src/include/* irrlicht/include/
          cp irrlicht-src/build/libIrrlicht.a irrlicht/lib/

      - name: Configure
        run: |
          emcmake cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRUN_IN_PLACE=TRUE \
            -DBUILD_SERVER=FALSE \
            -DENABLE_SOUND=0 \
            -DSQLITE3_LIBRARY="$GITHUB_WORKSPACE/sqlite/lib/libsqlite3.a" \
            -DSQLITE3_INCLUDE_DIR="$GITHUB_WORKSPACE/sqlite/include" \
            -DJPEG_LIBRARY="$GITHUB_WORKSPACE/libjpeg/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$GITHUB_WORKSPACE/libjpeg/include" \
            -DBZIP2_LIBRARIES="$GITHUB_WORKSPACE/bzip2/lib/libbz2.a" \
            -DBZIP2_INCLUDE_DIR="$GITHUB_WORKSPACE/bzip2/include" \
            -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib/include" \
            -DPNG_LIBRARY="$GITHUB_WORKSPACE/libpng/lib/libpng18.a" \
            -DPNG_PNG_INCLUDE_DIR="$GITHUB_WORKSPACE/libpng/include" \
            -DZSTD_LIBRARY="$GITHUB_WORKSPACE/zstd/lib/libzstd.a" \
            -DZSTD_INCLUDE_DIR="$GITHUB_WORKSPACE/zstd/include"

      - name: Build
        run: |
          cmake --build build --parallel
